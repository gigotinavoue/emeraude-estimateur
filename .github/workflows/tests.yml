name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contrôle de sécurité (secrets, données privées, PDF)
        run: node scripts/security-check.mjs
      - name: Tests automatiques (moteur, pipeline, données, automatisation)
        run: npm test
